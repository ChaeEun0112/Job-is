services:
  redis:
    image: redis:8-alpine
    container_name: jobis-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  api-blue:
    image: ${IMAGE}:${TAG:-dev-latest}
    container_name: jobis-dev-api-blue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      REDIS_HOST: redis
    ports:
      - "18080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  api-green:
    image: ${IMAGE}:${TAG:-dev-latest}
    container_name: jobis-dev-api-green
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      REDIS_HOST: redis
    ports:
      - "18081:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: jobis-dev-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - api-blue
      - api-green

volumes:
  redis-data:
