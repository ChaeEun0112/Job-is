    @keyframes cardIn { from { opacity: 0; transform: translateY(8px) scale(0.99); } to { opacity: 1; transform: none; } }

    }
    /* the briefing card — translucent emerald glass */
    .brief-card {
      /* opaque base FIRST, emerald tint floats on top — never see-through */
      background: linear-gradient(160deg, rgba(16,185,129,0.12), rgba(16,185,129,0) 55%), #15151a;
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 24px 60px -24px rgba(0,0,0,0.7);
    }
    /* ══════════ NEWSLETTER / LETTER ══════════ */
    .masthead-rule { border-bottom: 1px solid rgba(255,255,255,0.12); }
    /* match score as a postmark / rubber stamp */
    .seal {
      width: 4.7rem; height: 4.7rem; border-radius: 9999px; transform: rotate(-9deg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 1.5px dashed rgba(16,185,129,0.55);
      background: radial-gradient(circle, rgba(16,185,129,0.12), transparent 72%);
      box-shadow: inset 0 0 12px rgba(16,185,129,0.08);

    .seal-label { font-size: 8px; letter-spacing: .03em; color: #34d399; opacity: .8; margin-bottom: 1px; }

    .seal-pct { font-size: .85rem; font-weight: 700; }
    /* letter body — a touch of editorial warmth */
    .letter-body { font-size: 1.18rem; line-height: 1.85; color: #e4e4e7; }

    .arrow-btn { transition: all .3s cubic-bezier(.16,1,.3,1); }
    .arrow-btn:hover { transform: scale(1.08); border-color: rgba(16,185,129,0.4); color: #fff; }
    .arrow-btn:active { transform: scale(.94); }
    .magnetic-cta { transition: all .4s cubic-bezier(.16,1,.3,1); }
    .magnetic-cta:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(16,185,129,0.3); }
    .magnetic-cta:active { transform: scale(.98); }
    .magnetic-cta .arrow-icon { transition: transform .4s cubic-bezier(.16,1,.3,1); }
    .magnetic-cta:hover .arrow-icon { transform: translateX(4px); }

    .kr-text { word-break: keep-all; overflow-wrap: break-word; }
    .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    .balance { text-wrap: balance; }
    .dot { transition: all .3s ease; }
    .fb-btn { transition: all .2s ease; }

    /* body tabs */
    .tab {
      position: relative; padding: .55rem 1rem; font-size: .95rem; font-weight: 500;
      color: #71717a; transition: color .2s ease; white-space: nowrap;
    }
    .tab:hover { color: #d4d4d8; }
    .tab.tab-on { color: #fafafa; font-weight: 600; }
    .tab.tab-on::after {
      content: ''; position: absolute; left: 1rem; right: 1rem; bottom: -1px;
      height: 2px; background: #10b981; border-radius: 2px;
    }

    /* ══════════ REASONING TRACE — the hero ══════════ */
    .trace { position: relative; padding-left: 1.6rem; }
    .trace::before {                                   /* the spine that connects your signals */
      content: ''; position: absolute; left: 5px; top: 7px; bottom: 14px; width: 2px;
      background: linear-gradient(180deg, #10b981, rgba(16,185,129,0.18));
      transform: scaleY(0); transform-origin: top;
    }
    .trace-node { position: relative; padding-bottom: 1.15rem; }
    .trace-node:last-child { padding-bottom: .6rem; }
    .trace-dot {
      position: absolute; left: 0; top: 5px; width: 11px; height: 11px; border-radius: 9999px;
      background: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,0.14); transform: scale(0);
    }
    .trace-src {
      display: inline-flex; align-items: center; gap: .32rem;
      font-size: .72rem; font-weight: 700; letter-spacing: .02em; color: #34d399;
    }
    .trace-text { font-size: .95rem; line-height: 1.62; color: #a1a1aa; margin-top: .25rem; }
    .trace-conclusion {
      display: flex; gap: .8rem; align-items: center; margin-top: .35rem;
      padding: .85rem 1rem; border-radius: .95rem;
      background: linear-gradient(135deg, rgba(16,185,129,0.13), rgba(16,185,129,0.035));
      border: 1px solid rgba(16,185,129,0.22);
    }
    .trace-conc-arrow {
      flex: 0 0 auto; width: 2rem; height: 2rem; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(16,185,129,0.18); color: #34d399; font-size: 1.05rem;
    }
    /* default: hidden, revealed by .play (set when card becomes active / brief tab opens) */
    .trace-wrap .trace-node, .trace-wrap .trace-conclusion { opacity: 0; }
    @keyframes spineGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes nodeIn   { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @keyframes dotPop   { 0% { transform: scale(0); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
    .trace-wrap.play .trace::before  { animation: spineGrow .7s cubic-bezier(.16,1,.3,1) forwards; }
    .trace-wrap.play .trace-node     { animation: nodeIn .5s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--i) * .16s + .15s); }
    .trace-wrap.play .trace-dot      { animation: dotPop .45s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--i) * .16s + .2s); }
    .trace-wrap.play .trace-conclusion { animation: nodeIn .55s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--n) * .16s + .28s); }

    /* ══════════ DOCUMENT FAN — 비서가 건네는 서류 묶음 ══════════ */
    .stage {
      position: relative; width: 100%;
      transition: height .6s cubic-bezier(.16,1,.3,1);
    }
    .deck {
      position: relative; width: 100%; max-width: 52rem; margin: 0 auto;
      transition: height .6s cubic-bezier(.16,1,.3,1);
    }
    .paper {
      position: absolute; top: 0; left: 0; right: 0; margin: 0 auto;
      transform-origin: 50% 130%;            /* pivot below → papers arc as they fan */
      will-change: transform, opacity;
      transition: transform .72s cubic-bezier(.18,.9,.28,1), opacity .55s ease, filter .55s ease;
    }
    .paper:not(.is-front) { pointer-events: none; }
    .paper.is-front { } /* interactive layer */

    /* ══════════ INTRO / LOADING ══════════ */
    @keyframes introIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .intro-line { opacity: 0; animation: introIn .7s cubic-bezier(.16,1,.3,1) forwards; }
    .intro-line.d0 { animation-delay: 0s; }
    .intro-line.d1 { animation-delay: .35s; }
    .intro-line.d2 { animation-delay: .7s; }
    .intro-line.d3 { animation-delay: 1.05s; }
    #intro { transition: opacity .9s ease, transform .9s cubic-bezier(.16,1,.3,1), filter .9s ease; }
    #intro.gone { opacity: 0; transform: translateY(-26px) scale(1.05); filter: blur(10px); pointer-events: none; }
    #stage { opacity: 0; transition: opacity .8s ease; }
    #stage.show { opacity: 1; }
    .chrome { opacity: 0; transition: opacity .6s ease; }
    .chrome.show { opacity: 1; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }

    @media (prefers-reduced-motion: reduce) {
      .paper, #intro, #stage, .deck { transition: none; }
      .intro-line { animation: none; opacity: 1; }
      .trace-wrap .trace-node, .trace-wrap .trace-conclusion { opacity: 1 !important; animation: none !important; }
      .trace-wrap .trace-dot { transform: scale(1) !important; animation: none !important; }
      .trace::before { transform: scaleY(1) !important; animation: none !important; }
    }
  </style>
</head>

                <p class="text-[15px] leading-relaxed text-zinc-200 kr-text">${a.verdict}</p>
              </div>
            </div>
          </div>`;
      }).join('');
      const restShorts = USER.priorities.filter(k => job.axes[k] && !chosen.includes(k) && job.axes[k].state === 'met').slice(0, 3).map(k => AXIS[k].short);
      const rest = restShorts.length
        ? `<p class="mt-5 flex items-center gap-1.5 text-[13px] text-zinc-500 kr-text"><iconify-icon icon="solar:check-read-linear" class="text-accent-500/70"></iconify-icon>${restShorts.join('·')}도 확인했고 큰 문제 없었어요.</p>`
        : '';
      return `
        <div class="mt-7 pt-6 border-t border-white/10">
          <div class="flex items-center gap-1.5 mb-1 text-accent-400 text-[11px] font-semibold tracking-[0.14em] uppercase">
            <iconify-icon icon="solar:checklist-minimalistic-bold" class="text-sm"></iconify-icon>
            당신의 기준으로 따져봤어요
          </div>
          <p class="text-[15px] text-zinc-400 kr-text mb-4">${job.companyName ? job.companyName + '를' : '이 회사를'} <b class="text-zinc-200 font-semibold">당신이 가장 중요하게 보는 세 가지</b>로 따져봤어요.</p>
          <div class="space-y-2.5">${rows}</div>
          ${rest}
        </div>`;
    }

    const chipHTML = (c) => {
      if (Array.isArray(c)) {
        const [text, tone] = c;
        const cls = tone === 'rose'
          ? 'bg-rose-500/12 border-rose-500/25 text-rose-300'
          : 'bg-accent-500/12 border-accent-500/25 text-accent-300';
        return `<span class="inline-flex items-center px-3 py-1.5 rounded-full border ${cls} text-sm font-medium">${text}</span>`;
      }
      return `<span class="inline-flex items-center px-3 py-1.5 rounded-full bg-zinc-800/50 border border-zinc-700/40 text-sm text-zinc-300">${c}</span>`;
    };

    function faceHTML(j, idx) {
      const chips = j.chips.map(chipHTML).join('');
      const sectors = (j.sectors || []).map(s =>
        `<span class="px-2.5 py-1 rounded-md bg-white/[0.04] border border-white/10 text-[12px] text-zinc-300 kr-text">${s}</span>`
      ).join('');
      const glanceItem = (label, val) =>
        `<div class="flex flex-col gap-0.5"><dt class="text-[11px] text-zinc-500">${label}</dt><dd class="text-[14px] text-zinc-200 kr-text">${val}</dd></div>`;
      const SRC_ICON = { '성향':'solar:chart-2-bold', '자소서':'solar:document-text-bold', '활동':'solar:cursor-square-bold' };
      const trace = j.why.map((w, i) =>
        `<li class="trace-node" style="--i:${i}">
          <span class="trace-dot"></span>
          <span class="trace-src"><iconify-icon icon="${SRC_ICON[w.src] || 'solar:bolt-bold'}"></iconify-icon>${w.src}</span>
          <p class="trace-text kr-text">${w.text}</p>
        </li>`
      ).join('');
      const fits = j.fits.map(f =>
        `<li class="flex gap-3 text-base text-zinc-300 kr-text"><iconify-icon icon="solar:check-circle-bold" class="text-accent-500 text-xl mt-0.5 shrink-0"></iconify-icon><span>${f}</span></li>`
      ).join('');
      const role = j.role.map(r =>
        `<li class="flex gap-3 text-base text-zinc-300 kr-text"><iconify-icon icon="solar:check-circle-bold" class="text-accent-500 text-xl mt-0.5 shrink-0"></iconify-icon><span>${r}</span></li>`
      ).join('');
      const req = j.req.map(r =>
        `<li class="flex gap-3 text-base text-zinc-300 kr-text"><iconify-icon icon="solar:arrow-right-linear" class="text-zinc-500 text-xl mt-0.5 shrink-0"></iconify-icon><span>${r}</span></li>`
      ).join('');
      const ring = `conic-gradient(#10b981 ${j.match*3.6}deg, rgba(255,255,255,0.08) 0)`;

      return `
      <div class="paper" data-idx="${idx}">
        <article class="brief-card rounded-3xl p-7 sm:p-10 relative overflow-hidden">
          <div class="absolute -top-16 -right-16 w-48 h-48 bg-emerald-500/10 rounded-full blur-[70px] pointer-events-none"></div>
          <div class="relative">
            <!-- ══ MASTHEAD ══ -->
            <div class="masthead-rule flex items-end justify-between pb-3.5">
              <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-md bg-accent-500 flex items-center justify-center">
                  <iconify-icon icon="solar:letter-bold" class="text-white text-sm"></iconify-icon>
                </div>
                <div class="leading-none">
                  <span class="font-display font-extrabold tracking-tight text-zinc-100">Job.is</span>
                  <span class="text-zinc-500 font-medium tracking-[0.2em] text-[10px] ml-1.5 uppercase">Daily</span>
                </div>
              </div>
              <div class="text-right leading-tight">
                <div class="tnum text-[11px] text-zinc-400">2026. 5. 27. (화)</div>
                <div class="text-[10px] text-zinc-600 tracking-wide kr-text">VOL.01 · 오늘의 ${idx + 1}번째 편지</div>
              </div>
            </div>

            <!-- ══ HEADLINE + 우표 도장 ══ -->
            <div class="mt-7 flex items-start justify-between gap-4">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 mb-2.5 text-accent-400 text-[12px] font-semibold tracking-wide kr-text">
                  <span class="relative flex h-1.5 w-1.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-accent-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-accent-500"></span>
                  </span>
                  추천 이유 · ${j.reason}
                </div>
                <h2 class="font-display text-[1.9rem] sm:text-[2.4rem] font-bold tracking-tight leading-[1.14] text-zinc-50 kr-text balance">${j.title}</h2>
                <p class="mt-2.5 text-[15px] text-zinc-400 kr-text">${j.company}</p>
              </div>
              <div class="seal shrink-0">
                <span class="seal-label">적합도</span>
                <span class="seal-num tnum">${j.match}<span class="seal-pct">%</span></span>
              </div>
            </div>

            <!-- chips -->
            <div class="mt-5 flex flex-wrap gap-2">${chips}</div>

            <!-- ══ 회사 한눈에 — At a Glance (탭 위, 항상 노출) ══ -->
            <div class="mt-6 rounded-2xl border border-white/10 bg-white/[0.02] p-5">
              <div class="flex items-center gap-1.5 mb-3 text-zinc-400 text-[11px] font-semibold tracking-[0.14em] uppercase">
                <iconify-icon icon="solar:buildings-3-bold" class="text-sm"></iconify-icon>
                At a Glance · 회사 한눈에
              </div>
              <p class="text-[15px] leading-relaxed text-zinc-200 kr-text">${j.desc || ''}</p>
              <div class="mt-3 flex flex-wrap gap-1.5">${sectors}</div>
              <dl class="mt-5 grid grid-cols-2 gap-x-4 gap-y-4">
                ${glanceItem('위치 · 근무', j.loc || '—')}
                ${glanceItem('규모 · 성장', j.co.growth)}
                ${glanceItem('투자 단계', j.co.funding)}
                ${glanceItem('평판', j.co.rating + ' <span class="text-zinc-500 text-[12px]">잡플래닛</span>')}
              </dl>
            </div>

            <!-- TAB BAR -->
            <div class="mt-6 flex items-center gap-1 border-b border-white/10">
              <button data-tab="brief" data-idx="${idx}" class="tab tab-on">브리핑</button>
              <button data-tab="cond"  data-idx="${idx}" class="tab">조건</button>
              <button data-tab="co"    data-idx="${idx}" class="tab">회사</button>
            </div>

            <!-- PANELS -->
            <div class="mt-6">
              <!-- 브리핑 -->
              <div data-panel="brief">
                <div class="flex items-center gap-1.5 mb-3 text-accent-400 text-[11px] font-semibold tracking-[0.14em] uppercase">
                  <iconify-icon icon="solar:pen-2-bold" class="text-sm"></iconify-icon>
                  Editor's Note · 비서의 노트
                </div>
                <p class="letter-body kr-text">${j.brief}</p>

                <!-- ★ 고려 매트릭스 — 당신의 Top3 기준으로 따져봤어요 -->
                ${matrixHTML(j)}

                <!-- ★ 추천 근거 쓰레드 — 너의 신호 → 이 공고 -->
                <div class="trace-wrap mt-7 pt-6 border-t border-white/10" style="--n:${j.why.length}">
                  <div class="flex items-center gap-1.5 mb-1 text-accent-400 text-[11px] font-semibold tracking-[0.14em] uppercase">
                    <iconify-icon icon="solar:user-heart-bold" class="text-sm"></iconify-icon>
                    당신이라서 더 맞아요
                  </div>
                  <p class="text-[15px] text-zinc-400 kr-text mb-5">조건만이 아니라, 일하는 방식과 성향까지 봤어요.</p>
                  <ul class="trace">${trace}</ul>
                  <div class="trace-conclusion">
                    <span class="trace-conc-arrow"><iconify-icon icon="solar:arrow-down-linear"></iconify-icon></span>
                    <div class="min-w-0">
                      <span class="block text-[11px] text-zinc-500 kr-text">그래서, 오늘 이 공고를 골랐습니다</span>
                      <p class="text-zinc-100 font-semibold kr-text leading-snug">${j.title} <span class="tnum text-accent-400">· ${j.match}% 일치</span></p>
                    </div>
                  </div>
                </div>

                <div class="mt-7 pt-6 border-t border-white/10">
                  <p class="text-xs font-semibold tracking-wider text-zinc-500 mb-4">이 자리의 좋은 점</p>
                  <ul class="space-y-3.5">${fits}</ul>
                </div>

                <!-- ✍︎ 서명 — 비서의 사인오프 -->
                <div class="mt-8 flex items-center gap-3">
                  <div class="shrink-0 w-9 h-9 rounded-full bg-gradient-to-br from-accent-400 to-emerald-700 flex items-center justify-center font-display font-extrabold text-zinc-950">J</div>
                  <div class="leading-tight">
                    <p class="text-[15px] text-zinc-200 kr-text">오늘도 좋은 결과 있으시길 바랍니다.</p>
                    <p class="text-[11px] text-zinc-500 mt-0.5">— Job.is 비서 드림</p>
                  </div>
                </div>
              </div>
              <!-- 조건 -->
              <div data-panel="cond" hidden>
                <div class="flex items-center gap-1.5 mb-3 text-accent-400 text-xs font-semibold tracking-wide">
                  <iconify-icon icon="solar:checklist-minimalistic-bold" class="text-sm"></iconify-icon>
                  이런 일을 해요
                </div>
                <ul class="space-y-3">${role}</ul>
                <div class="mt-7 pt-6 border-t border-white/10">
                  <div class="flex items-center gap-1.5 mb-3 text-zinc-400 text-xs font-semibold tracking-wide">
                    <iconify-icon icon="solar:user-check-rounded-linear" class="text-sm"></iconify-icon>
                    이런 분을 찾아요
                  </div>
                  <ul class="space-y-3">${req}</ul>
                </div>
              </div>
              <!-- 회사 -->
              <div data-panel="co" hidden>
                <div class="space-y-3.5 text-base">
                  <div class="flex items-center justify-between"><span class="text-zinc-400">직원 증가</span><span class="tnum font-semibold text-accent-400">${j.co.growth}</span></div>
                  <div class="flex items-center justify-between border-t border-white/5 pt-3.5"><span class="text-zinc-400">잡플래닛 평점</span><span class="font-semibold text-amber-400">${j.co.rating}</span></div>
                  <div class="flex items-center justify-between border-t border-white/5 pt-3.5"><span class="text-zinc-400">누적 투자</span><span class="tnum font-semibold text-zinc-100">${j.co.funding}</span></div>
                </div>
                <div class="mt-6 pt-6 border-t border-white/10">
                  <div class="flex items-center gap-1.5 mb-2 text-accent-400 text-xs font-semibold tracking-wide">
                    <iconify-icon icon="solar:lightbulb-bold" class="text-sm"></iconify-icon>
                    Job.is 한줄 분석
                  </div>
                  <p class="text-[15px] leading-relaxed text-zinc-400 kr-text">${j.co.note}</p>
                </div>
              </div>
            </div>

            <!-- feedback + actions -->
            <div class="mt-7 pt-6 border-t border-white/10">
              <div class="flex items-center justify-between gap-3">
                <span class="fbLabel text-sm text-zinc-500 kr-text">이 추천, 어떤가요?</span>
                <div class="flex items-center gap-1.5">
                  <button data-fb="up" data-idx="${idx}" class="fb-btn w-10 h-10 rounded-lg flex items-center justify-center text-zinc-500 hover:text-accent-400" aria-label="좋아요"><iconify-icon icon="solar:like-linear" class="text-xl"></iconify-icon></button>
                  <button data-fb="down" data-idx="${idx}" class="fb-btn w-10 h-10 rounded-lg flex items-center justify-center text-zinc-500 hover:text-rose-400" aria-label="별로예요"><iconify-icon icon="solar:dislike-linear" class="text-xl"></iconify-icon></button>
                </div>
              </div>
              <div class="mt-5 flex items-center gap-3">
                <button class="px-6 py-3.5 rounded-xl flex items-center justify-center gap-2 text-zinc-400 hover:text-zinc-100 transition-colors"><iconify-icon icon="solar:bookmark-linear" class="text-lg"></iconify-icon><span class="font-medium">저장</span></button>
                <a href="#" class="magnetic-cta flex-1 py-3.5 rounded-xl bg-accent-500 hover:bg-accent-400 text-zinc-950 font-bold text-lg flex items-center justify-center gap-2 no-underline">지원하기 <iconify-icon icon="solar:arrow-right-linear" class="arrow-icon text-xl"></iconify-icon></a>
              </div>
            </div>
          </div>
        </article>
      </div>`;
    }

    const stage = $('stage'), deck = $('prism');
    deck.innerHTML = JOBS.map(faceHTML).join('');
    const papers = [...deck.children];

    // transform for one paper at signed distance d from the front sheet
    function place(d) {
      const ad = Math.abs(d), sign = Math.sign(d), cap = Math.min(ad, 3);
      if (!opened) {                          // closed bundle — sheets stacked behind the front one
        return { t: `translateX(0px) translateY(${cap * 3}px) rotate(0deg) scale(${1 - cap * 0.02})`,
                 o: d === 0 ? 1 : 0, z: 100 - ad, f: 'none' };
      }
      const x   = sign * (cap === 0 ? 0 : 46 + (cap - 1) * 22);   // fan spread
      const y   = cap * cap * 8;                                  // edges dip → arc
      const rot = sign * cap * 5;                                 // tilt like fanned paper
      const sc  = 1 - cap * 0.05;
      const o   = ad === 0 ? 1 : ad === 1 ? 0.5 : ad === 2 ? 0.26 : 0.13;
      const f   = ad === 0 ? 'none' : `brightness(${(1 - cap * 0.16).toFixed(3)}) blur(${cap * 2.6}px)`;  // out-of-focus depth
      return { t: `translateX(${x}px) translateY(${y}px) rotate(${rot}deg) scale(${sc})`, o, z: 100 - ad, f };
    }
    function render() {
      papers.forEach((p, k) => {
        const s = place(k - cur);             // finite stack — no wraparound
        p.style.transform = s.t;
        p.style.opacity   = String(s.o);
        p.style.zIndex    = String(s.z);
        p.style.filter    = s.f;
        p.classList.toggle('is-front', k === cur);
      });
    }
    function resizeHeight() {
      const h = papers[cur].offsetHeight;
      deck.style.height = h + 'px';
      stage.style.height = h + 'px';
    }
    function playTrace(face) {                 // replay the reasoning-trace draw-in
      const w = face && face.querySelector('.trace-wrap');
      if (!w) return;
      w.classList.remove('play'); void w.offsetWidth; w.classList.add('play');
    }
    function setArrows() {
      const atStart = cur === 0, atEnd = cur === N - 1;
      ['prevD','prevM'].forEach(id => { const b = $(id); if (b) { b.style.opacity = atStart ? '0.3' : ''; b.style.pointerEvents = atStart ? 'none' : ''; } });
      ['nextD','nextM'].forEach(id => { const b = $(id); if (b) { b.style.opacity = atEnd ? '0.3' : ''; b.style.pointerEvents = atEnd ? 'none' : ''; } });
    }
    function updateChrome() {
      $('cur').textContent = String(cur + 1).padStart(2, '0');
      $('dots').innerHTML = JOBS.map((_, k) =>
        `<button data-dot="${k}" class="dot rounded-full ${k===cur ? 'w-5 h-1.5 bg-accent-500' : 'w-1.5 h-1.5 bg-zinc-700 hover:bg-zinc-500'}" aria-label="${k+1}번째"></button>`
      ).join('');
      setArrows();
    }
    function layout() { render(); resizeHeight(); }
    function afterNav() { render(); updateChrome(); resizeHeight(); playTrace(papers[cur]); }
    function step(dir) {
      const t = Math.min(N - 1, Math.max(0, cur + dir));
      if (t === cur) return;
      cur = t; afterNav();
    }
    function goTo(t) {
      t = Math.min(N - 1, Math.max(0, t));
      if (t === cur) return;
      cur = t; afterNav();
    }

    function paintFB(idx) {
      const sec = papers[idx], st = fb[idx];
      const up = sec.querySelector('[data-fb="up"]'), down = sec.querySelector('[data-fb="down"]');
      up.className = 'fb-btn w-10 h-10 rounded-lg flex items-center justify-center ' + (st === 'up' ? 'text-accent-400 bg-accent-500/15' : 'text-zinc-500 hover:text-accent-400');
      down.className = 'fb-btn w-10 h-10 rounded-lg flex items-center justify-center ' + (st === 'down' ? 'text-rose-400 bg-rose-500/15' : 'text-zinc-500 hover:text-rose-400');
      sec.querySelector('.fbLabel').innerHTML = st === 'up'
        ? '<span class="text-accent-400">네, 비슷한 공고를 더 찾아 보고드릴게요</span>'
        : st === 'down' ? '<span class="text-accent-400">알겠습니다, 다음부터 줄이겠습니다</span>'
        : '이 추천, 어떤가요?';
    }

    function chromeShow() { document.querySelectorAll('.chrome').forEach(el => el.classList.add('show')); }

    // events
    $('total').textContent = String(N).padStart(2, '0');
    ['prevD','prevM'].forEach(id => $(id).onclick = () => step(-1));
    ['nextD','nextM'].forEach(id => $(id).onclick = () => step(1));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  step(-1);
      if (e.key === 'ArrowRight') step(1);
    });
    $('dots').addEventListener('click', e => {
      const d = e.target.closest('[data-dot]'); if (d) goTo(+d.dataset.dot);
    });
    document.addEventListener('click', e => {        // tabs
      const t = e.target.closest('[data-tab]'); if (!t) return;
      const sec = papers[+t.dataset.idx], name = t.dataset.tab;
      sec.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('tab-on', b.dataset.tab === name));
      sec.querySelectorAll('[data-panel]').forEach(p => { p.hidden = (p.dataset.panel !== name); });
      if (name === 'brief') playTrace(sec);
      resizeHeight();
    });
    document.addEventListener('click', e => {        // feedback
      const b = e.target.closest('[data-fb]'); if (!b) return;
      const idx = +b.dataset.idx;
      fb[idx] = (fb[idx] === b.dataset.fb) ? null : b.dataset.fb;
      paintFB(idx);
    });

    // swipe
    let x0 = null;
    stage.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
    stage.addEventListener('touchend', e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
      x0 = null;
    });

    window.addEventListener('resize', layout);
    window.addEventListener('load', () => setTimeout(layout, 50));

    // initial build — closed bundle
    layout(); updateChrome();
    setTimeout(layout, 300);

    // ── intro / loading → the assistant fans the bundle open ──
    (function intro() {
      const introEl = $('intro');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) {
        opened = true; render(); resizeHeight();
        if (introEl) introEl.remove();
        stage.classList.add('show'); chromeShow();
        playTrace(papers[cur]);
        return;
      }
      setTimeout(() => {
        if (introEl) introEl.classList.add('gone');
        stage.classList.add('show'); chromeShow();
        opened = true; render(); resizeHeight();          // fan the papers open
        setTimeout(() => playTrace(papers[cur]), 850);     // then draw the trace
      }, 2400);
      setTimeout(() => { if (introEl) introEl.remove(); }, 3500);
    })();
  </script>
</body>
</html>
